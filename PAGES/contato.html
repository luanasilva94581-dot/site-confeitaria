
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pedidos - Confeitaria Sempre Doce</title>

    <link rel="stylesheet" href="../CSS/contato.css">
    <link rel="shortcut icon" href="../IMG/logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@400;700&family=Macondo&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="div-logo">
            <img class="logotipo" src="../IMG/logo.png"
                 alt="Logo da confeitaria">
        </div>

        <div class="div-menu">
            <h1>Confeitaria Sempre Doce</h1>

            <nav>
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </nav>
        </div>

        <div class="div-logo"></div>
    </header>

    <main>
        <section class="contato">

            <h2>Faça seu pedido!</h2>

            <p class="descricao">
                Preencha os dados abaixo para solicitar
                seu pedido na Confeitaria Sempre Doce.
            </p>

            <form id="formPedido">

                <h3>Dados do cliente</h3>

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                       placeholder="Digite seu nome" required>

                <label for="endereco">Endereço de entrega:</label>
                <input type="text" id="endereco" name="endereco"
                       placeholder="Rua, número, bairro e cidade" required>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone"
                       placeholder="(00) 00000-0000" required>

                <h3>Informações do pedido</h3>

                <label for="item">Escolha seu bolo:</label>
                <select id="item" name="item" required>
                    <option value="">Selecione um item</option>

                    <!-- Substitua os preços pelos preços reais -->
                    <option value="Bolo do Spider-man" data-preco="60">
                        Bolo de Chocolate - R$ 60,00
                    </option>

                    <option value="Bolo Vangogh" data-preco="85">
                        Bolo de Morango - R$ 85,00
                    </option>

                    <option value="Bolo theo_cake" data-preco="45">
                        Bolo de Cenoura - R$ 45,00
                    </option>

                    <option value="Bela" data-preco="85">
                        Bolo da Bela - R$ 85,00
                    </option>

                    <option value="Bolo la casa de papel" data-preco="65">
                        Bolo la casa de papel - R$ 65,00
                    </option>

                    <option value="ALICE" data-preco="85">
                        Bolo da Alice - R$ 85,00
                    </option>
                </select>

                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade"
                       name="quantidade" min="1" value="1" required>

                <label for="informacoes">Informações adicionais do pedido:</label>
                <textarea id="informacoes" name="informacoes"
                          rows="4"
                          placeholder="Escreva o tamanho, recheio, decoração ou outros detalhes..."></textarea>

                <label for="total">Valor total:</label>
                <input type="text" id="total" name="total"
                       value="R$ 0,00" readonly>

                <h3>Forma de pagamento</h3>

                <label for="pagamento">Como deseja pagar?</label>
                <select id="pagamento" name="pagamento" required>
                    <option value="">Selecione a forma de pagamento</option>
                    <option value="Pix">Pix</option>
                    <option value="Cartão de crédito">Cartão de crédito</option>
                    <option value="Cartão de débito">Cartão de débito</option>
                </select>

                <button type="submit">Finalizar pedido</button>

                <p id="retorno" role="status"></p>

            </form>
        </section>
    </main>

    <footer>
        &copy; 2026 Confeitaria Sempre Doce.
        Todos os direitos reservados.
    </footer>

    <script>
        const formulario = document.getElementById("formPedido");
        const item = document.getElementById("item");
        const quantidade = document.getElementById("quantidade");
        const total = document.getElementById("total");
        const retorno = document.getElementById("retorno");

        function calcularTotal() {
            const opcao = item.options[item.selectedIndex];
            const preco = Number(opcao.dataset.preco || 0);
            const qtd = Number(quantidade.value) || 0;

            const valorTotal = preco * qtd;

            total.value = valorTotal.toLocaleString("pt-BR", {
                style: "currency",
                currency: "BRL"
            });
        }

        item.addEventListener("change", calcularTotal);
        quantidade.addEventListener("input", calcularTotal);

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            calcularTotal();

            retorno.textContent =
                "Pedido preenchido! Confira os dados antes de confirmar com a confeitaria.";
        });
    </script>

</body>
</html>
